name: Downstream compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downstream-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.19.0, 24]
    runs-on: ubuntu-latest
    steps:
      - name: Check out downstream
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out downstream
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js 22.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run audit:runtime
      - run: npm pack --dry-run
      - name: Validate Workbench compatibility manifest
        run: >-
          node -e "const fs=require('fs'); const m=require('./downstream/compatibility.json');
          const p=require('./package.json'); const lists=[m.requiredTools,m.requiredCommands];
          const valid=lists.every(a=>Array.isArray(a)&&a.length>0&&new Set(a).size===a.length&&a.every(v=>typeof v==='string'&&/^[a-z][a-z0-9_-]*$/.test(v)));
          if(m.schemaVersion!==1||m.package!==p.name||m.extension!=='index.ts'||!fs.existsSync(m.extension)||!valid) process.exit(1)"

  disposable-distribution:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/stable'
    runs-on: ubuntu-latest
    needs: [test, package]
    steps:
      - name: Check out downstream
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js 22.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
      - name: Install the reviewed Pi baseline
        run: >-
          npm install --prefix _pi --no-package-lock
          @earendil-works/pi-coding-agent@0.84.4
      - name: Verify install, update, rollback, and stable return
        env:
          PI_INSTALL_ROOT: ${{ github.workspace }}/_pi
          PI_EXPECTED_STABLE_SHA: ${{ github.sha }}
        run: node downstream/verify-distribution.mjs
